name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The suite runs entirely against saved fixtures - CI never calls an upstream API,
        # so a rate-limited or briefly-down provider can never turn the build red.
        run: pytest

      - name: Prove the suite is offline
        # Re-runs everything with sockets denied. A test that quietly starts calling a live
        # API fails here instead of making the build depend on someone else's uptime.
        run: pytest -p netblock
